<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>duck1001's Repo</title>
    <style>
        :root {
            --bg-start: #f5f5fa;
            --bg-end: #e9e9f0;
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.85);
            --text-primary: #1c1c1e;
            --text-secondary: #6c6c70;
            --accent: #007aff;
            --accent-pressed: #0051d5;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius-lg: 28px;
            --radius-btn: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #f9f9fd 0%, #ececf2 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 20px;
        }

        /* 极简背景微光，保持干净不干扰 */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 30% 40%, rgba(0, 122, 255, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(175, 130, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        /* 图标区域 */
        .icon-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }
        .icon-wrap img {
            width: 94px;
            height: 94px;
            border-radius: 24px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.7);
            background: #fff;
            object-fit: cover;
            transition: transform 0.25s cubic-bezier(0.34, 1.3, 0.64, 1), box-shadow 0.3s ease;
        }
        .icon-wrap img:active {
            transform: scale(1.04);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.1), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
        }

        /* 标题与副标题 */
        .repo-title {
            font-size: 28px;
            font-weight: 680;
            letter-spacing: -0.4px;
            color: #1c1c1e;
            margin-bottom: 2px;
            line-height: 1.2;
        }
        .repo-sub {
            font-size: 15px;
            font-weight: 500;
            color: #8e8e93;
            margin-bottom: 36px;
            letter-spacing: 0.1px;
        }

        /* 唯一的 Sileo 按钮 - iOS 风格 */
        .sileo-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 17px;
            font-weight: 590;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.22, 0.61, 0.36, 1);
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.25), 0 2px 4px rgba(0, 0, 0, 0.04);
            letter-spacing: -0.2px;
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        /* 按钮按下效果 */
        .sileo-btn:active {
            transform: scale(0.97);
            background: var(--accent-pressed);
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.35), 0 1px 2px rgba(0, 0, 0, 0.06);
            transition: all 0.1s ease;
        }
        .sileo-btn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            flex-shrink: 0;
        }
        .sileo-btn span {
            position: relative;
            z-index: 1;
        }

        /* 极简页脚 */
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #8e8e93;
            letter-spacing: 0.2px;
            text-align: center;
        }
        .footer a {
            color: #007aff;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }
        .footer a:active {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 图标 -->
        <div class="icon-wrap">
            <img src="CydiaIcon.png" alt="duck1001 Repo Icon">
        </div>

        <!-- 名称 -->
        <h1 class="repo-title">Roothide 插件源</h1>
        <p class="repo-sub">15-17</p>

        <!-- 只有 Sileo 添加按钮 -->
        <a class="sileo-btn" href="sileo://source/https://duck1001.github.io/sileo-repo">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <span>添加到 Sileo</span>
        </a>

        <!-- 页脚 -->
        <div class="footer">
            <a href="https://github.com/duck1001/sileo-repo">GitHub</a>
        </div>
    </div>
</body>
</html>
