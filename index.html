<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Roothide 插件源</title>
<script>
(function () {
  try {
    var mode = localStorage.getItem('rh-theme') || 'auto';
    var dark = mode === 'dark' ||
      (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.mode = mode;
  } catch (e) {}
})();
</script>
<style>
/* ===================== 设计令牌 ===================== */
:root {
  --bg: #f2f2f7;
  --bar-bg: rgba(242, 242, 247, .78);
  --card: #ffffff;
  --card-2: #f7f7fa;
  --text: #0a0a0c;
  --text-2: #5c5c66;
  --text-3: #8e8e93;
  --line: rgba(0, 0, 0, .07);
  --field: rgba(118, 118, 128, .12);
  --seg-bg: rgba(118, 118, 128, .12);
  --thumb: #ffffff;
  --accent: #0a84ff;
  --accent-2: #5e5ce6;
  --teal: #2fb8b8;
  --red: #ff3b30;
  --green: #34c759;
  --skeleton: rgba(120, 120, 128, .12);
  --skeleton-hi: rgba(120, 120, 128, .06);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04), 0 2px 10px rgba(0, 0, 0, .05);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, .05), 0 14px 38px rgba(0, 0, 0, .09);
  --shadow-lg: 0 30px 70px rgba(0, 0, 0, .22);
  --bg-grad-1: rgba(10, 132, 255, .10);
  --bg-grad-2: rgba(94, 92, 230, .10);
  --r-xl: 26px;
  --r-lg: 22px;
  --r-md: 16px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.42, .64, 1);
}

:root[data-theme="dark"] {
  --bg: #000000;
  --bar-bg: rgba(10, 10, 12, .72);
  --card: #1c1c1e;
  --card-2: #2c2c2e;
  --text: #f2f2f7;
  --text-2: #aeaeb2;
  --text-3: #8e8e93;
  --line: rgba(255, 255, 255, .09);
  --field: rgba(118, 118, 128, .24);
  --seg-bg: rgba(118, 118, 128, .22);
  --thumb: #48484a;
  --skeleton: rgba(120, 120, 128, .2);
  --skeleton-hi: rgba(120, 120, 128, .09);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-md: 0 8px 30px rgba(0, 0, 0, .6);
  --shadow-lg: 0 30px 70px rgba(0, 0, 0, .8);
  --bg-grad-1: rgba(10, 132, 255, .16);
  --bg-grad-2: rgba(94, 92, 230, .16);
}

/* ===================== 基础 ===================== */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Helvetica Neue", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: calc(48px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  transition: background .5s var(--ease), color .5s var(--ease);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(900px 620px at 6% -12%, var(--bg-grad-1), transparent 62%),
    radial-gradient(760px 560px at 106% 6%, var(--bg-grad-2), transparent 62%);
}

img {
  display: block;
  max-width: 100%;
}

button,
input {
  font: inherit;
  color: inherit;
}

/* ===================== 波纹 ===================== */
.ripple {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

.ripple-wave {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, .42);
  transform: scale(0);
  opacity: .9;
  pointer-events: none;
  animation: rippleOut .62s var(--ease) forwards;
}

@keyframes rippleOut {
  to {
    transform: scale(1);
    opacity: 0;
  }
}

/* ===================== 主题按钮 ===================== */
.theme-toggle {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top));
  right: 16px;
  z-index: 200;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: .5px solid rgba(255, 255, 255, .28);
  background: rgba(0, 0, 0, .3);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform .4s var(--spring), background .3s;
}

.theme-toggle:active {
  transform: scale(.88);
}

.theme-toggle svg {
  width: 18px;
  height: 18px;
  position: absolute;
  transition: opacity .35s var(--ease), transform .5s var(--spring);
}

.theme-toggle .ic-sun {
  opacity: 0;
  transform: rotate(-90deg) scale(.4);
}

.theme-toggle .ic-moon {
  opacity: 1;
  transform: none;
}

:root[data-theme="dark"] .theme-toggle .ic-sun {
  opacity: 1;
  transform: none;
}

:root[data-theme="dark"] .theme-toggle .ic-moon {
  opacity: 0;
  transform: rotate(90deg) scale(.4);
}

/* ===================== 轮播 ===================== */
.hero {
  width: 100%;
  max-width: 680px;
  margin: 14px auto 0;
  padding: 0 14px;
  animation: riseIn .7s var(--ease) both;
}

.hero-card {
  position: relative;
  border-radius: var(--r-xl);
  overflow: hidden;
  height: clamp(178px, 50vw, 236px);
  background: #111;
  box-shadow: var(--shadow-md);
  touch-action: pan-y;
  cursor: pointer;
  transform: translateZ(0);
  user-select: none;
  -webkit-user-select: none;
}

.hero-track {
  display: flex;
  height: 100%;
  will-change: transform;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
}

.hero-track img {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  -webkit-user-drag: none;
  user-select: none;
}

.hero-card::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(0, 0, 0, .16) 0%, transparent 34%, rgba(0, 0, 0, .42) 100%);
}

.hero-dots {
  position: absolute;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .28);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border: .5px solid rgba(255, 255, 255, .18);
}

.hero-dots button {
  width: 6px;
  height: 6px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, .48);
  cursor: pointer;
  transition: width .5s var(--spring), background .35s var(--ease);
}

.hero-dots button.active {
  width: 20px;
  background: #fff;
}

.hero-badge {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 2;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .3px;
  color: #fff;
  background: rgba(0, 0, 0, .3);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: .5px solid rgba(255, 255, 255, .2);
}

/* ===================== 标题 ===================== */
.head {
  width: 100%;
  max-width: 680px;
  margin: 22px auto 4px;
  padding: 0 20px;
  text-align: center;
  animation: riseIn .7s .06s var(--ease) both;
}

.head-title {
  font-size: clamp(23px, 6.4vw, 27px);
  font-weight: 750;
  letter-spacing: -.5px;
  background: linear-gradient(135deg, var(--text) 25%, var(--accent) 130%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.25;
}

.head-sub {
  margin-top: 6px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: .2px;
}

/* ===================== 工具栏 ===================== */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 60;
  padding: 12px 14px;
  transition: background .38s var(--ease), box-shadow .38s var(--ease),
    backdrop-filter .38s var(--ease);
}

.toolbar.stuck {
  background: var(--bar-bg);
  backdrop-filter: blur(22px) saturate(190%);
  -webkit-backdrop-filter: blur(22px) saturate(190%);
  box-shadow: 0 1px 0 var(--line), 0 8px 24px rgba(0, 0, 0, .04);
}

.toolbar-inner {
  max-width: 652px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  height: 46px;
  padding: 0 14px;
  border-radius: 15px;
  background: var(--field);
  border: 1.5px solid transparent;
  transition: border-color .3s var(--ease), background .3s var(--ease),
    box-shadow .3s var(--ease);
}

.search-wrap:focus-within {
  border-color: var(--accent);
  background: var(--card);
  box-shadow: 0 0 0 4px rgba(10, 132, 255, .14), var(--shadow-sm);
}

.search-icon {
  width: 17px;
  height: 17px;
  flex: 0 0 auto;
  color: var(--text-3);
  transition: color .3s;
}

.search-wrap:focus-within .search-icon {
  color: var(--accent);
}

.search-input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 15.5px;
  font-weight: 500;
  letter-spacing: -.1px;
  -webkit-appearance: none;
  appearance: none;
}

.search-input::placeholder {
  color: var(--text-3);
  font-weight: 400;
}

.search-input::-webkit-search-cancel-button {
  -webkit-appearance: none;
}

.clear-btn {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: 50%;
  background: var(--text-3);
  color: var(--card);
  font-size: 15px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  opacity: 0;
  transform: scale(.5);
  transition: opacity .25s var(--ease), transform .35s var(--spring);
  pointer-events: none;
}

.clear-btn.show {
  opacity: .75;
  transform: scale(1);
  pointer-events: auto;
}

.clear-btn:active {
  transform: scale(.82);
}

/* 分段控件 */
.segmented {
  position: relative;
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--seg-bg);
}

.seg-thumb {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 0;
  border-radius: 999px;
  background: var(--thumb);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04);
  transition: transform .48s var(--spring), width .48s var(--spring);
  will-change: transform, width;
}

.seg-btn {
  position: relative;
  z-index: 1;
  flex: 1;
  border: 0;
  background: transparent;
  padding: 9px 12px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  transition: color .3s var(--ease), transform .2s;
}

.seg-btn.active {
  color: var(--text);
}

.seg-btn:active {
  transform: scale(.96);
}

/* ===================== 最近更新 ===================== */
.log-panel {
  width: 100%;
  max-width: 652px;
  margin: 6px auto 0;
  padding: 16px 18px;
  border-radius: var(--r-lg);
  background: var(--card);
  border: .5px solid var(--line);
  box-shadow: var(--shadow-sm);
  animation: riseIn .7s .1s var(--ease) both;
  transition: background .5s var(--ease);
}

.log-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: .5px solid var(--line);
}

.log-head h2 {
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: -.1px;
}

.log-pulse {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 0 rgba(52, 199, 89, .5);
  animation: pulse 2.2s var(--ease) infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(52, 199, 89, .5); }
  70% { box-shadow: 0 0 0 8px rgba(52, 199, 89, 0); }
  100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
}

.log-list {
  list-style: none;
}

.log-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  font-size: 14px;
  border-bottom: .5px solid var(--line);
}

.log-list li:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.log-list li:first-child {
  padding-top: 0;
}

.log-name {
  flex: 1;
  min-width: 0;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.log-ver {
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--field);
  font-variant-numeric: tabular-nums;
}

/* ===================== 插件列表 ===================== */
.list {
  width: 100%;
  max-width: 652px;
  margin: 14px auto 0;
  padding: 0 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.pkg {
  position: relative;
  padding: 16px;
  border-radius: var(--r-lg);
  background: var(--card);
  border: .5px solid var(--line);
  box-shadow: var(--shadow-sm);
  transition: transform .45s var(--ease), box-shadow .45s var(--ease),
    background .5s var(--ease), border-color .3s;
  will-change: transform;
}

@media (hover: hover) {
  .pkg:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }
}

.pkg:active {
  transform: scale(.988);
}

.pkg-top {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 11px;
}

.pkg-icon {
  position: relative;
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  overflow: hidden;
  display: grid;
  place-items: center;
  font-size: 23px;
  font-weight: 750;
  color: #fff;
  letter-spacing: -.5px;
  background: linear-gradient(135deg, var(--c1, #5b8def), var(--c2, #8f6bff));
  box-shadow: 0 4px 12px rgba(0, 0, 0, .13), inset 0 0 0 .5px rgba(255, 255, 255, .18);
  user-select: none;
}

.pkg-icon img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .4s var(--ease);
}

.pkg-icon img.ok {
  opacity: 1;
}

.pkg-meta {
  flex: 1;
  min-width: 0;
}

.pkg-name {
  font-size: 16.5px;
  font-weight: 680;
  letter-spacing: -.25px;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pkg-sub {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  min-width: 0;
}

.badge {
  flex: 0 0 auto;
  padding: 2.5px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .25px;
  text-transform: uppercase;
}

.badge.arm64e {
  color: #5e5ce6;
  background: rgba(94, 92, 230, .13);
}

.badge.arm64 {
  color: #1a9e46;
  background: rgba(52, 199, 89, .14);
}

.badge.other {
  color: var(--text-3);
  background: var(--field);
}

:root[data-theme="dark"] .badge.arm64e {
  color: #9d9bff;
  background: rgba(94, 92, 230, .24);
}

:root[data-theme="dark"] .badge.arm64 {
  color: #5ee07f;
  background: rgba(52, 199, 89, .22);
}

.pkg-id {
  flex: 1;
  min-width: 0;
  font-size: 11.5px;
  color: var(--text-3);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pkg-ver {
  flex: 0 0 auto;
  align-self: flex-start;
  margin-top: 2px;
  padding: 3px 9px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 650;
  color: var(--text-2);
  background: var(--field);
  font-variant-numeric: tabular-nums;
}

.pkg-desc {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text-2);
  margin-bottom: 11px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.pkg-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 13px;
}

.tag {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 550;
  color: var(--text-2);
  background: var(--card-2);
  border: .5px solid var(--line);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pkg-actions {
  display: flex;
  gap: 9px;
}

.btn {
  position: relative;
  overflow: hidden;
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 16px;
  border: 0;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -.1px;
  color: #fff;
  text-decoration: none;
  cursor: pointer;
  transition: transform .35s var(--spring), filter .25s, box-shadow .35s;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .14);
  -webkit-user-select: none;
  user-select: none;
}

.btn:active {
  transform: scale(.955);
}

.btn svg {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
}

.btn.dl {
  background: linear-gradient(135deg, #ff6f5e, #e93b2a);
}

.btn.sileo {
  background: linear-gradient(135deg, #46cdcd, #239b9f);
}

@media (hover: hover) {
  .btn:hover {
    filter: brightness(1.08);
  }
}

/* ===================== 骨架屏 ===================== */
.sk {
  border-radius: 8px;
  background: linear-gradient(90deg, var(--skeleton) 25%, var(--skeleton-hi) 37%, var(--skeleton) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
}

@keyframes shimmer {
  0% { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}

.sk-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  flex: 0 0 auto;
}

.sk-line {
  height: 11px;
  margin-top: 8px;
}

.sk-line:first-child {
  margin-top: 0;
}

.sk-w70 { width: 70%; }
.sk-w45 { width: 45%; }
.sk-w95 { width: 95%; }
.sk-w60 { width: 60%; }
.sk-btn {
  flex: 1;
  height: 40px;
  border-radius: 14px;
}

/* ===================== 空状态 ===================== */
.empty {
  padding: 56px 24px;
  text-align: center;
  animation: riseIn .55s var(--ease) both;
}

.empty svg {
  width: 46px;
  height: 46px;
  color: var(--text-3);
  opacity: .55;
  margin: 0 auto 14px;
}

.empty p {
  font-size: 15px;
  font-weight: 550;
  color: var(--text-2);
}

.empty span {
  display: block;
  margin-top: 6px;
  font-size: 13px;
  color: var(--text-3);
}

/* ===================== 弹窗 ===================== */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 9000;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(0, 0, 0, .42);
  backdrop-filter: blur(12px) saturate(160%);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  opacity: 0;
  visibility: hidden;
  transition: opacity .42s var(--ease), visibility .42s;
}

.overlay.show {
  opacity: 1;
  visibility: visible;
}

.sheet {
  width: min(330px, 88vw);
  padding: 26px 22px 18px;
  border-radius: 28px;
  background: var(--card);
  box-shadow: var(--shadow-lg);
  text-align: center;
  transform: translateY(34px) scale(.93);
  opacity: 0;
  transition: transform .55s var(--spring), opacity .38s var(--ease);
}

.overlay.show .sheet {
  transform: none;
  opacity: 1;
}

.sheet-icon {
  width: 62px;
  height: 62px;
  margin: 0 auto 15px;
  border-radius: 19px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #46cdcd, #239b9f);
  box-shadow: 0 8px 22px rgba(35, 155, 159, .35);
}

.sheet-icon svg {
  width: 30px;
  height: 30px;
  color: #fff;
}

.sheet h3 {
  font-size: 18px;
  font-weight: 720;
  letter-spacing: -.3px;
}

.sheet p {
  margin-top: 7px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text-2);
  word-break: break-all;
}

.sheet-actions {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.sheet-actions .btn {
  flex: none;
  width: 100%;
  padding: 13px;
  border-radius: 15px;
}

.btn.ghost {
  background: var(--field);
  color: var(--text);
  box-shadow: none;
  font-weight: 600;
}

/* ===================== Toast ===================== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(34px + env(safe-area-inset-bottom));
  z-index: 9500;
  transform: translate(-50%, 24px) scale(.94);
  opacity: 0;
  pointer-events: none;
  padding: 11px 20px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  background: var(--card);
  box-shadow: var(--shadow-md);
  border: .5px solid var(--line);
  transition: transform .5s var(--spring), opacity .35s var(--ease);
  max-width: 84vw;
  text-align: center;
}

.toast.show {
  transform: translate(-50%, 0) scale(1);
  opacity: 1;
}

/* ===================== 页脚 ===================== */
.footer {
  margin-top: 34px;
  text-align: center;
  font-size: 12.5px;
  color: var(--text-3);
  animation: riseIn .7s .15s var(--ease) both;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  transition: opacity .25s;
}

.footer a:active {
  opacity: .6;
}

/* ===================== 动画 ===================== */
@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>

<script>
(function () {
  'use strict';

  /* ============================================================
     常量 & 工具
  ============================================================ */
  var REPO_BASE = 'https://duck1001.github.io/sileo-repo/';
  var PACKAGES_URL = REPO_BASE + 'Packages';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  function escapeHTML(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function haptic(ms) {
    if (navigator.vibrate) {
      try { navigator.vibrate(ms || 8); } catch (e) {}
    }
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }

  /* ------------------------------------------------------------
     Toast
  ------------------------------------------------------------ */
  var toastEl = $('#toast');
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2000);
  }

  /* ------------------------------------------------------------
     波纹
  ------------------------------------------------------------ */
  document.addEventListener('pointerdown', function (e) {
    var el = e.target.closest ? e.target.closest('.ripple') : null;
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height) * 1.7;
    var span = document.createElement('span');
    span.className = 'ripple-wave';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size / 2) + 'px';
    span.style.top = (e.clientY - rect.top - size / 2) + 'px';
    el.appendChild(span);
    setTimeout(function () {
      if (span.parentNode) span.parentNode.removeChild(span);
    }, 640);
  }, { passive: true });

  /* ------------------------------------------------------------
     主题
  ------------------------------------------------------------ */
  var themeBtn = $('#themeToggle');
  var mq = window.matchMedia('(prefers-color-scheme: dark)');

  function applyTheme(mode) {
    var dark = mode === 'dark' || (mode === 'auto' && mq.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.mode = mode;
    try { localStorage.setItem('rh-theme', mode); } catch (e) {}
  }

  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.dataset.mode || 'auto';
    var next = cur === 'auto' ? (mq.matches ? 'light' : 'dark')
      : cur === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    haptic(10);
    toast(next === 'dark' ? '已切换到深色模式' : '已切换到浅色模式');
  });

  mq.addEventListener('change', function () {
    if ((document.documentElement.dataset.mode || 'auto') === 'auto') applyTheme('auto');
  });

  /* ============================================================
     轮播
  ============================================================ */
  var heroCard = $('#heroCard');
  var track = $('#heroTrack');
  var dotsWrap = $('#heroDots');

  var realSlides = Array.prototype.slice.call(track.children);
  var N = realSlides.length;

  // 首尾克隆，实现无缝循环
  var cloneFirst = realSlides[0].cloneNode(true);
  var cloneLast = realSlides[N - 1].cloneNode(true);
  track.appendChild(cloneFirst);
  track.insertBefore(cloneLast, realSlides[0]);

  var pos = 1;              // 轨道位置 1..N
  var slideW = 0;
  var dragging = false;
  var locked = false;
  var startX = 0, startY = 0, delta = 0;
  var suppressClick = false;
  var autoTimer = null;
  var dots = [];

  // 创建指示点
  for (var i = 0; i < N; i++) {
    (function (idx) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', '第 ' + (idx + 1) + ' 张');
      if (idx === 0) b.classList.add('active');
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        haptic(8);
        goto(idx + 1);
        scheduleAuto();
      });
      dotsWrap.appendChild(b);
      dots.push(b);
    })(i);
  }

  function setDots(logicalIndex) {
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('active', i === logicalIndex);
    }
  }

  function applyTransform(dx, animate) {
    if (animate) {
      track.style.transition = 'transform .68s cubic-bezier(.22,1,.36,1)';
    } else {
      track.style.transition = 'none';
      void track.offsetWidth; // 强制回流
    }
    track.style.transform = 'translate3d(' + (-pos * slideW + dx) + 'px,0,0)';
  }

  function goto(newPos, animate) {
    pos = newPos;
    applyTransform(0, animate !== false);
    setDots(((pos - 1) % N + N) % N);
  }

  function next() {
    if (dragging) return;
    goto(pos + 1);
  }

  track.addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'transform') return;
    if (pos > N) {
      pos = 1;
      applyTransform(0, false);
    } else if (pos < 1) {
      pos = N;
      applyTransform(0, false);
    }
  });

  function measure() {
    slideW = heroCard.clientWidth;
    applyTransform(0, false);
  }

  // 自动播放
  function scheduleAuto() {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(function () {
      next();
      scheduleAuto();
    }, 4200);
  }
  function stopAuto() {
    clearTimeout(autoTimer);
  }

  // 指针拖拽
  heroCard.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true;
    locked = false;
    startX = e.clientX;
    startY = e.clientY;
    delta = 0;
    stopAuto();
    track.style.transition = 'none';
    try { heroCard.setPointerCapture(e.pointerId); } catch (err) {}
  });

  heroCard.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;

    if (!locked) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) {
        // 判定为垂直滚动，交还给浏览器
        dragging = false;
        delta = 0;
        goto(pos);
        return;
      }
      locked = true;
    }

    e.preventDefault();
    delta = dx;
    // 边缘阻尼
    if ((pos === 1 && delta > 0) || (pos === N && delta < 0)) delta *= 0.42;
    track.style.transform = 'translate3d(' + (-pos * slideW + delta) + 'px,0,0)';
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    var dx = delta;
    delta = 0;

    if (Math.abs(dx) > 10) {
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 340);
    }

    var threshold = Math.min(slideW * 0.18, 64);
    if (dx <= -threshold) goto(pos + 1);
    else if (dx >= threshold) goto(pos - 1);
    else goto(pos);

    scheduleAuto();
  }

  heroCard.addEventListener('pointerup', endDrag);
  heroCard.addEventListener('pointercancel', endDrag);

  heroCard.addEventListener('click', function () {
    if (suppressClick) return;
    haptic(10);
    openSheet();
  });

  // 尺寸变化
  if (window.ResizeObserver) {
    new ResizeObserver(measure).observe(heroCard);
  } else {
    window.addEventListener('resize', measure);
  }

  measure();
  scheduleAuto();

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopAuto();
    else scheduleAuto();
  });

  /* ============================================================
     弹窗
  ============================================================ */
  var overlay = $('#overlay');
  var sheetConfirm = $('#sheetConfirm');
  var sheetCancel = $('#sheetCancel');

  function openSheet() {
    overlay.classList.add('show');
    stopAuto();
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    overlay.classList.remove('show');
    document.body.style.overflow = '';
    scheduleAuto();
  }

  sheetConfirm.addEventListener('click', function () {
    closeSheet();
    haptic(14);
    window.location.href = 'sileo://source/' + REPO_BASE;
  });
  sheetCancel.addEventListener('click', function () {
    haptic(8);
    closeSheet();
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeSheet();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeSheet();
  });

  /* ============================================================
     工具栏粘性状态
  ============================================================ */
  var toolbar = $('#toolbar');
  var toolbarTicking = false;

  function onScroll() {
    if (toolbarTicking) return;
    toolbarTicking = true;
    requestAnimationFrame(function () {
      var r = toolbar.getBoundingClientRect();
      toolbar.classList.toggle('stuck', r.top <= 0.5);
      toolbarTicking = false;
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* ============================================================
     分段控件滑块
  ============================================================ */
  var segmented = $('#segmented');
  var segThumb = $('#segThumb');
  var segBtns = $$('.seg-btn', segmented);

  function moveThumb() {
    var active = segmented.querySelector('.seg-btn.active');
    if (!active) return;
    var parentRect = segmented.getBoundingClientRect();
    var r = active.getBoundingClientRect();
    segThumb.style.width = r.width + 'px';
    segThumb.style.transform = 'translateX(' + (r.left - parentRect.left) + 'px)';
  }

  /* ============================================================
     图标渐变色板
  ============================================================ */
  var PALETTES = [
    ['#5b8def', '#8f6bff'],
    ['#2fb8b8', '#3fd1a4'],
    ['#ff7a59', '#ff4d6d'],
    ['#7f6bff', '#c86bff'],
    ['#f9a03f', '#f7d54d'],
    ['#4facfe', '#00d4ff'],
    ['#fa709a', '#fe9a6b'],
    ['#30c48d', '#1fa2ff']
  ];

  function hashStr(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) {
      h = (h * 31 + str.charCodeAt(i)) >>> 0;
    }
    return h;
  }

  function paletteFor(str) {
    return PALETTES[hashStr(str) % PALETTES.length];
  }

  /* ============================================================
     数据
  ============================================================ */
  var state = {
    packages: [],
    arch: 'all',
    search: ''
  };

  var listEl = $('#list');
  var logPanel = $('#logPanel');
  var logList = $('#logList');
  var searchBox = $('#searchBox');
  var clearBtn = $('#clearBtn');

  /* ------------------------------------------------------------
     骨架屏
  ------------------------------------------------------------ */
  function renderSkeletons(count) {
    var html = '';
    for (var i = 0; i < count; i++) {
      html +=
        '<div class="pkg">' +
          '<div class="pkg-top">' +
            '<div class="sk sk-icon"></div>' +
            '<div style="flex:1">' +
              '<div class="sk sk-line sk-w70" style="height:14px;margin-top:0"></div>' +
              '<div class="sk sk-line sk-w45"></div>' +
            '</div>' +
          '</div>' +
          '<div class="sk sk-line sk-w95"></div>' +
          '<div class="sk sk-line sk-w60"></div>' +
          '<div style="display:flex;gap:9px;margin-top:14px">' +
            '<div class="sk sk-btn"></div>' +
            '<div class="sk sk-btn"></div>' +
          '</div>' +
        '</div>';
    }
    listEl.innerHTML = html;
  }

  /* ------------------------------------------------------------
     解析 Packages
  ------------------------------------------------------------ */
  function parsePackages(text) {
    var chunks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\n+/);
    var out = [];

    chunks.forEach(function (chunk) {
      var pkg = {};
      var lastKey = null;

      chunk.split('\n').forEach(function (line) {
        if (!line.trim()) return;

        // 续行
        if (/^\s/.test(line) && lastKey) {
          pkg[lastKey] += '\n' + line.trim();
          return;
        }

        var idx = line.indexOf(':');
        if (idx < 0) return;

        var key = line.slice(0, idx).trim();
        var value = line.slice(idx + 1).trim();
        if (!key) return;

        pkg[key] = value;
        lastKey = key;
      });

      if (pkg.Package && pkg.Filename) out.push(pkg);
    });

    return out;
  }

  /* ------------------------------------------------------------
     架构标签
  ------------------------------------------------------------ */
  function archInfo(arch) {
    if (arch === 'iphoneos-arm64e') return { cls: 'arm64e', label: 'arm64e · roothide' };
    if (arch === 'iphoneos-arm64') return { cls: 'arm64', label: 'arm64 · rootless' };
    return { cls: 'other', label: arch || 'unknown' };
  }

  /* ------------------------------------------------------------
     最近更新
  ------------------------------------------------------------ */
  function renderRecent() {
    var recent = state.packages.slice(-6).reverse();
    if (!recent.length) {
      logPanel.hidden = true;
      return;
    }
    logPanel.hidden = false;

    var html = '';
    recent.forEach(function (p) {
      html +=
        '<li>' +
          '<span class="log-name">' + escapeHTML(p.Name || p.Package) + '</span>' +
          '<span class="log-ver">v' + escapeHTML(p.Version || '—') + '</span>' +
        '</li>';
    });
    logList.innerHTML = html;
  }

  /* ------------------------------------------------------------
     渲染插件列表
  ------------------------------------------------------------ */
  function buildCard(p, index) {
    var name = p.Name || p.Package;
    var pkgId = p.Package || '';
    var arch = p.Architecture || '';
    var info = archInfo(arch);

    var pal = paletteFor(pkgId || name);
    var letter = String(name).trim().charAt(0).toUpperCase() || '?';

    var iconSrc = '';
    if (p.Icon) {
      iconSrc = /^https?:\/\//i.test(p.Icon) ? p.Icon : REPO_BASE + p.Icon.replace(/^\/+/, '');
    }

    var debUrl = REPO_BASE + String(p.Filename || '').replace(/^\/+/, '');

    var el = document.createElement('article');
    el.className = 'pkg';
    el.innerHTML =
      '<div class="pkg-top">' +
        '<div class="pkg-icon" style="--c1:' + pal[0] + ';--c2:' + pal[1] + '">' +
          '<span>' + escapeHTML(letter) + '</span>' +
          (iconSrc
            ? '<img src="' + escapeHTML(iconSrc) + '" alt="" loading="lazy" ' +
              'onload="this.classList.add(\'ok\')" onerror="this.remove()">'
            : '') +
        '</div>' +
        '<div class="pkg-meta">' +
          '<h3 class="pkg-name">' + escapeHTML(name) + '</h3>' +
          '<div class="pkg-sub">' +
            '<span class="badge ' + info.cls + '">' + escapeHTML(info.label) + '</span>' +
            '<span class="pkg-id">' + escapeHTML(pkgId) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="pkg-ver">v' + escapeHTML(p.Version || '—') + '</div>' +
      '</div>' +
      '<p class="pkg-desc">' + escapeHTML(p.Description || '暂无描述') + '</p>' +
      '<div class="pkg-tags">' +
        (p.Author ? '<span class="tag">' + escapeHTML(p.Author) + '</span>' : '') +
        (p.Section ? '<span class="tag">' + escapeHTML(p.Section) + '</span>' : '') +
        (p.Depends ? '<span class="tag">依赖 ' + escapeHTML(p.Depends.split(',')[0].trim()) + '</span>' : '') +
      '</div>' +
      '<div class="pkg-actions">' +
        '<a class="btn dl ripple" href="' + escapeHTML(debUrl) + '" download rel="noopener">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 20h16"/>' +
          '</svg>下载 .deb' +
        '</a>' +
        '<button class="btn sileo ripple" type="button" data-sileo>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 5v14"/><path d="M5 12h14"/>' +
          '</svg>添加到 Sileo' +
        '</button>' +
      '</div>';

    // 添加到 Sileo
    var sileoBtn = el.querySelector('[data-sileo]');
    sileoBtn.addEventListener('click', function () {
      haptic(14);
      window.location.href = 'sileo://source/' + REPO_BASE;
    });

    // 入场动画（错峰）
    if (el.animate) {
      el.animate(
        [
          { opacity: 0, transform: 'translateY(14px) scale(.985)' },
          { opacity: 1, transform: 'none' }
        ],
        {
          duration: 420,
          delay: Math.min(index, 9) * 28,
          easing: 'cubic-bezier(.22,1,.36,1)',
          fill: 'backwards'
        }
      );
    }

    return el;
  }

  function renderPackages() {
    var q = state.search.trim().toLowerCase();

    var filtered = state.packages.filter(function (p) {
      if (state.arch !== 'all' && (p.Architecture || '') !== state.arch) return false;
      if (!q) return true;
      return (p.Name || '').toLowerCase().indexOf(q) > -1 ||
             (p.Package || '').toLowerCase().indexOf(q) > -1;
    });

    // 最新上传的排前面
    filtered.reverse();

    if (!filtered.length) {
      listEl.innerHTML =
        '<div class="empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="11" cy="11" r="7.5"/><path d="M20.5 20.5l-4-4"/>' +
          '</svg>' +
          '<p>没有找到匹配的插件</p>' +
          '<span>试试其他关键词或切换筛选条件</span>' +
        '</div>';
      return;
    }

    var frag = document.createDocumentFragment();
    filtered.forEach(function (p, i) {
      frag.appendChild(buildCard(p, i));
    });
    listEl.replaceChildren(frag);
  }

  /* ------------------------------------------------------------
     数据加载
  ------------------------------------------------------------ */
  function loadPackages() {
    renderSkeletons(4);

    fetch(PACKAGES_URL, { cache: 'no-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        state.packages = parsePackages(text);
        renderRecent();
        renderPackages();
      })
      .catch(function (err) {
        console.error('[Roothide] 加载失败:', err);
        listEl.innerHTML =
          '<div class="empty">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
              '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.2v.1"/>' +
            '</svg>' +
            '<p>无法加载插件列表</p>' +
            '<span>请检查网络连接后重试</span>' +
          '</div>';
      });
  }

  /* ------------------------------------------------------------
     搜索（防抖）
  ------------------------------------------------------------ */
  var handleSearch = debounce(function (value) {
    state.search = value;
    renderPackages();
  }, 140);

  searchBox.addEventListener('input', function (e) {
    var v = e.target.value;
    clearBtn.classList.toggle('show', v.length > 0);
    handleSearch(v);
  });

  searchBox.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.target.blur();
      haptic(8);
    }
  });

  clearBtn.addEventListener('click', function () {
    searchBox.value = '';
    clearBtn.classList.remove('show');
    state.search = '';
    renderPackages();
    haptic(8);
    searchBox.focus();
  });

  /* ------------------------------------------------------------
     筛选
  ------------------------------------------------------------ */
  segBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.classList.contains('active')) return;
      segBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      moveThumb();
      state.arch = btn.dataset.arch;
      renderPackages();
      haptic(8);
    });
  });

  window.addEventListener('resize', function () {
    moveThumb();
  });

  /* ------------------------------------------------------------
     启动
  ------------------------------------------------------------ */
  // 等字体/布局稳定后再定位滑块
  requestAnimationFrame(function () {
    moveThumb();
    setTimeout(moveThumb, 120);
  });

  loadPackages();

})();
</script>
</body>
</html>
